<!-- @dsCard group="Fundamentos" height=760 width=1080 subtitle="Zonas seguras: o que a grade corta e o que a interface cobre em cada formato" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Zonas seguras</title></head>
<body style="margin:0; background:var(--grafite)">
<div style="display:flex; gap:24px; justify-content:center; align-items:flex-start; padding:48px 0">
  <div style="display:flex; flex-direction:column; gap:20px; width:324px">
    <div style="position:relative; width:324px; height:405px; overflow:hidden">
      <div class="ie-arte ie-grao" style="position:absolute; left:0; top:0; transform:scale(0.3); transform-origin:0 0">
        <div class="ie-guia-grade ie-esq"></div><div class="ie-guia-grade ie-dir"></div>
        <div class="ie-area ie-base"><p class="manchete ie-serif">Feed 4:5</p></div>
      </div>
    </div>
    <p class="nota ie-sans ie-suave">Feed 1080 × 1350. A grade 3:4 corta 34px de cada lado.</p>
  </div>
  <div style="display:flex; flex-direction:column; gap:20px; width:324px">
    <div style="position:relative; width:324px; height:576px; overflow:hidden">
      <div class="ie-arte ie-story ie-grao" style="position:absolute; left:0; top:0; transform:scale(0.3); transform-origin:0 0">
        <div class="ie-guia" style="top:0; height:250px"></div><div class="ie-guia" style="bottom:0; height:340px"></div>
        <div class="ie-area ie-centro"><p class="manchete ie-serif">Story</p></div>
      </div>
    </div>
    <p class="nota ie-sans ie-suave">Story 1080 × 1920. Livre: 250px em cima, 340px embaixo.</p>
  </div>
  <div style="display:flex; flex-direction:column; gap:20px; width:324px">
    <div style="position:relative; width:324px; height:576px; overflow:hidden">
      <div class="ie-arte ie-reels ie-grao" style="position:absolute; left:0; top:0; transform:scale(0.3); transform-origin:0 0">
        <div class="ie-guia" style="top:0; height:250px"></div><div class="ie-guia" style="bottom:0; height:440px"></div><div class="ie-guia-lado"></div>
        <div class="ie-area ie-centro"><p class="manchete ie-serif">Reels</p></div>
      </div>
    </div>
    <p class="nota ie-sans ie-suave">Reels 1080 × 1920. Livre: 250 em cima, 440 embaixo, 140 à direita.</p>
  </div>
</div>
</body>
</html>
