<html lang="pt-BR">
<head><meta charset="utf-8"><title>Grade do perfil</title></head>

    </div>
  </div></div>
  <div class="ie-perfil-tile"><div class="ie-arte ie-grao">

  </div></div>
  <div class="ie-perfil-tile"><div class="ie-arte ie-grao ie-brilho">

      <p class="ie-numeral-xl metal-text">2x</p>
      <div style="display:flex; flex-direction:column; gap:96px"><h1 class="manchete ie-serif">Dobrar a verba não dobra <em>as vendas.</em></h1><div class="ie-arraste"><span>Arraste</span></div></div>
    </div>
  </div></div>
  <div class="ie-perfil-tile"><div class="ie-arte" data-theme="marfim">
    <span class="ie-diagonal" style="left:990px; top:430px; height:520px; opacity:0.8"></span>
    <div class="ie-area ie-entre">
      <h1 class="capa ie-serif" style="margin-top:24px">Seu cliente não sumiu. <em>Esfriou.</em></h1>
      <div class="ie-arraste"><span>Arraste</span></div>
    </div>
  </div></div>
  <div class="ie-perfil-tile"><div class="ie-arte ie-grao ie-brilho">
    <span class="ie-diagonal" style="left:900px; top:-80px; height:700px"></span>
    <div class="ie-area ie-base">
      <h1 class="capa ie-serif">Anúncio não vende <em>nada</em> sozinho.</h1>
      <div class="ie-arraste" style="margin-top:96px"><span>Arraste</span></div>
    </div>
  </div></div>
  <div class="ie-perfil-tile"><div class="ie-arte ie-grao">
    <div class="ie-moldura"><div></div></div>
    <div class="ie-area ie-centro ie-centrado" style="gap:72px; z-index:2">
      <h1 class="capa ie-serif" style="font-size:150px">Antes de te chamar, ele <em>te confere.</em></h1>
      <div class="ie-arraste"><span>Arraste</span></div>
    </div>
  </div></div>
</div>
</div>
